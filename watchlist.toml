# Listings to follow, as TICKER:VENUE (`US` is the US composite), with the company's name.
#
# The stream is filtered server-side on these. Use each company's primary listing: the API links a
# company to an item by its primary listing, and that is what the watchlist is matched against.
# Items that link an instrument carry its name, which Jev sees; the name here is the fallback.

[companies]
"AAPL:US" = "Apple"
"NVDA:US" = "NVIDIA"
"MSFT:US" = "Microsoft"
"GOOG:US" = "Alphabet (Google)"
"AMZN:US" = "Amazon"
"META:US" = "Meta Platforms"
"TSLA:US" = "Tesla"
"AMD:US" = "Advanced Micro Devices"
"JPM:US" = "JPMorgan Chase"
"XOM:US" = "ExxonMobil"
"BA:US" = "Boeing"
"PFE:US" = "Pfizer"
"DKNG:US" = "DraftKings"
"WBD:US" = "Warner Bros. Discovery"
"FUBO:US" = "fuboTV"
"COIN:US" = "Coinbase"
